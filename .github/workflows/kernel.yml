name: kernel

# 编 DW99（SL8541E / SC9832E）的内核，然后拿原厂 boot.img 的
# header/ramdisk/dtb 重新打包成可刷的 boot.img。
#
# 默认走 LineageOS 17.1 那套：
#   内核仓库 zzzxxxxxxxxxx/android_kernel_sprd_sc9832e @ lineage-17.1 (4.4.147)
#   配置用仓库里的 arch/arm64/configs/lineageos_dw99_defconfig
# 想回到"从设备 boot.img 提取的 4.4.83 config"，把 defconfig 留空即可。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核仓库 owner/repo"
        required: false
        default: "zzzxxxxxxxxxx/android_kernel_sprd_sc9832e"
      kernel_branch:
        description: "分支"
        required: false
        default: "lineage-17.1"
      defconfig:
        description: "内核仓库 arch/arm64/configs 下的 defconfig（留空 = 用 configs/dw99-4.4.83.config）"
        required: false
        default: "lineageos_dw99_defconfig"
      extra_config:
        description: "追加到 .config 的内容（每行一条，可留空）"
        required: false
        default: ""
      build_modules:
        description: "是否编模块（失败不阻断，只是 .ko 会退回原厂那份）"
        required: false
        default: "true"
      dt_url:
        description: "替换 dt 的下载地址（留空 = 用 prebuilt/dt.bin）"
        required: false
        default: ""
      ramdisk_url:
        description: "替换 ramdisk 的下载地址（留空 = 用 prebuilt/ramdisk.gz）"
        required: false
        default: ""
      cmdline:
        description: "覆盖 boot header 里的 cmdline（留空 = 保留原厂）"
        required: false
        default: ""
      out_name:
        description: "产物文件名"
        required: false
        default: "boot-dw99-los17.1.img"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
              cpio kmod python3 xz-utils

      - name: Fetch AOSP 4.9 toolchain (设备内核就是用这个编的)
        run: |
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          ./gcc64/bin/aarch64-linux-android-gcc --version | head -1
          ./gcc32/bin/arm-linux-androideabi-gcc --version | head -1
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_ENV"

      - name: Clone kernel
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            "https://github.com/${{ inputs.kernel_repo }}.git" kernel
          du -sh kernel

      - name: Configure
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          DEFCONFIG="${{ inputs.defconfig }}"
          if [ -n "$DEFCONFIG" ]; then
            test -f "arch/arm64/configs/$DEFCONFIG" || {
              echo "!! 仓库里没有 arch/arm64/configs/$DEFCONFIG"; ls arch/arm64/configs; exit 1; }
            echo "用仓库自带 defconfig: $DEFCONFIG"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
                 CROSS_COMPILE_ARM32=arm-linux-androideabi- "$DEFCONFIG"
          else
            echo "用设备提取的 config: configs/dw99-4.4.83.config"
            cp "$GITHUB_WORKSPACE/configs/dw99-4.4.83.config" .config
          fi
          if [ -n "${{ inputs.extra_config }}" ]; then
            printf '\n%s\n' "${{ inputs.extra_config }}" >> .config
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig
          echo "--- 关键配置 ---"
          grep -E "^CONFIG_(LOCALVERSION=|PSTORE|PSTORE_CONSOLE|PSTORE_RAM|PSTORE_PMSG|BPF_SYSCALL|MODULES=|USB_CONFIGFS|F2FS_FS=|EROFS_FS)" .config || true
          grep -E "Linux/arm64" include/config/kernel.release 2>/dev/null || \
            make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- kernelrelease

      - name: Build Image
        run: |
          # 输出实时滚动（tee 一边打进日志一边存文件），别再用 tail 缓冲
          set -o pipefail
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          echo "开始编译 $(date -u +%H:%M:%S)，$(nproc) 并发"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               -j"$(nproc)" Image 2>&1 | tee "$GITHUB_WORKSPACE/build-image.log"
          echo "编译结束 $(date -u +%H:%M:%S)"
          ls -la arch/arm64/boot/Image
          echo "内核版本: $(strings arch/arm64/boot/Image | grep -m1 'Linux version')"

      - name: Build modules (best effort)
        if: inputs.build_modules == 'true'
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          set +e
          echo "开始编模块 $(date -u +%H:%M:%S)"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               -j"$(nproc)" modules 2>&1 | tee "$GITHUB_WORKSPACE/build-modules.log"
          echo "modules build exit: $?"
          echo "模块编译结束 $(date -u +%H:%M:%S)"
          rm -rf "$GITHUB_WORKSPACE/inst"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/inst"
          mkdir -p "$GITHUB_WORKSPACE/mods/lib/modules"
          for m in mali.ko sprdwl_ng.ko sprdbt_tty.ko sprd_fm.ko; do
            f="$(find "$GITHUB_WORKSPACE/inst" -name "$m" 2>/dev/null | head -1)"
            if [ -n "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/mods/lib/modules/$m"
              echo "把新编的 $m 塞进 ramdisk"
            else
              echo "!! 没编出 $m，ramdisk 里保留原厂那份（vermagic 可能不匹配）"
            fi
          done

      - name: Repack boot image
        env:
          DT_URL: ${{ inputs.dt_url }}
          RAMDISK_URL: ${{ inputs.ramdisk_url }}
          CMDLINE: ${{ inputs.cmdline }}
          OUT_NAME: ${{ inputs.out_name }}
        run: |
          # 可选：从网上下别的 dt / ramdisk
          dt=prebuilt/dt.bin
          ramdisk=prebuilt/ramdisk.gz
          if [ -n "$DT_URL" ]; then
            curl -fL --retry 3 -o dt.bin "$DT_URL"
            ls -la dt.bin
            dt=dt.bin
          fi
          if [ -n "$RAMDISK_URL" ]; then
            curl -fL --retry 3 -o ramdisk.gz "$RAMDISK_URL"
            ls -la ramdisk.gz
            ramdisk=ramdisk.gz
          fi

          args=(--header prebuilt/header.bin
                --kernel kernel/arch/arm64/boot/Image
                --ramdisk "$ramdisk"
                --dt "$dt"
                --device-tree-size-field
                --pad-to 36700160)   # boot 分区大小，和原厂镜像一样填零对齐
          if [ -n "$CMDLINE" ]; then
            args+=(--cmdline "$CMDLINE")
          fi
          if [ -n "$(ls -A mods/lib/modules 2>/dev/null)" ]; then
            args+=(--replace-dir mods)
          fi
          python3 scripts/boot_repack.py "${args[@]}" --out "$OUT_NAME"
          ls -la "$OUT_NAME"
          md5sum "$OUT_NAME"
          python3 - "$OUT_NAME" <<'PY'
          import struct, sys
          h = open(sys.argv[1], "rb").read(2048)
          print("cmdline:", h[64:576].split(b"\0")[0].decode())
          print("kernel_size:", struct.unpack_from("<I", h, 0x08)[0],
                "ramdisk_size:", struct.unpack_from("<I", h, 0x10)[0],
                "dt_size:", struct.unpack_from("<I", h, 0x28)[0])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dw99-kernel
          path: |
            ${{ inputs.out_name }}
            kernel/arch/arm64/boot/Image
            build-image.log
            build-modules.log
          if-no-files-found: error
