name: kernel

# 用设备内核里提取出来的 config（configs/dw99-4.4.83.config）编译 SL8541E
# 的 4.4.83 内核，然后拿原厂 boot.img 的 header/ramdisk/dtb 重新打包，
# 只替换 kernel（以及顺手把新编出来的 .ko 塞回 ramdisk）。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核仓库 owner/repo"
        required: false
        default: "zzzxxxxxxxxxx/Linux-4.4.83"
      kernel_branch:
        description: "分支"
        required: false
        default: "WIP"
      extra_config:
        description: "追加到 .config 的内容（每行一条，可留空）"
        required: false
        default: ""
      build_modules:
        description: "是否编模块（失败不阻断，只是 .ko 会退回原厂那份）"
        required: false
        default: "true"
      out_name:
        description: "产物文件名"
        required: false
        default: "boot-dw99-custom.img"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
              cpio kmod python3 xz-utils

      - name: Fetch AOSP 4.9 toolchain (设备内核就是用这个编的)
        run: |
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          ./gcc64/bin/aarch64-linux-android-gcc --version | head -1
          ./gcc32/bin/arm-linux-androideabi-gcc --version | head -1
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_ENV"

      - name: Clone kernel
        run: |
          git clone --depth 1 -b "${{ inputs.kernel_branch }}" \
            "https://github.com/${{ inputs.kernel_repo }}.git" kernel
          du -sh kernel

      - name: Configure
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          cp "$GITHUB_WORKSPACE/configs/dw99-4.4.83.config" .config
          if [ -n "${{ inputs.extra_config }}" ]; then
            printf '\n%s\n' "${{ inputs.extra_config }}" >> .config
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig >/dev/null
          echo "--- 关键配置 ---"
          grep -E "^CONFIG_(LOCALVERSION|PSTORE|PSTORE_CONSOLE|PSTORE_RAM|PSTORE_PMSG|BPF_SYSCALL|MODULES|USB_CONFIGFS|F2FS_FS)=" .config
          grep -E "Linux/arm64" include/config/kernel.release 2>/dev/null || \
            make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- kernelrelease

      - name: Build Image
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               -j"$(nproc)" Image 2>&1 | tail -25
          ls -la arch/arm64/boot/Image

      - name: Build modules (best effort)
        if: inputs.build_modules == 'true'
        run: |
          export PATH="$TOOLCHAIN:$PATH"
          cd kernel
          set +e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               -j"$(nproc)" modules 2>&1 | tail -25
          echo "modules build exit: $?"
          rm -rf "$GITHUB_WORKSPACE/inst"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- \
               CROSS_COMPILE_ARM32=arm-linux-androideabi- \
               modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/inst" >/dev/null 2>&1
          mkdir -p "$GITHUB_WORKSPACE/mods/lib/modules"
          for m in mali.ko sprdwl_ng.ko sprdbt_tty.ko sprd_fm.ko; do
            f="$(find "$GITHUB_WORKSPACE/inst" -name "$m" 2>/dev/null | head -1)"
            if [ -n "$f" ]; then
              cp "$f" "$GITHUB_WORKSPACE/mods/lib/modules/$m"
              echo "把新编的 $m 塞进 ramdisk"
            else
              echo "!! 没编出 $m，ramdisk 里保留原厂那份（vermagic 可能不匹配）"
            fi
          done

      - name: Repack boot image
        run: |
          ARGS=""
          if [ -n "$(ls -A mods/lib/modules 2>/dev/null)" ]; then
            ARGS="--replace-dir mods"
          fi
          python3 scripts/boot_repack.py \
            --header prebuilt/header.bin \
            --kernel kernel/arch/arm64/boot/Image \
            --ramdisk prebuilt/ramdisk.gz \
            --dt prebuilt/dt.bin \
            $ARGS \
            --out "${{ inputs.out_name }}"
          ls -la "${{ inputs.out_name }}"
          md5sum "${{ inputs.out_name }}"
          echo "内核版本: $(strings kernel/arch/arm64/boot/Image | grep -m1 'Linux version')"

      - uses: actions/upload-artifact@v4
        with:
          name: dw99-kernel
          path: |
            ${{ inputs.out_name }}
            kernel/arch/arm64/boot/Image
          if-no-files-found: error
